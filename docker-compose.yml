services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocklens
      POSTGRES_PASSWORD: stocklens
      POSTGRES_DB: stocklens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
